<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pearl of the Orient — Hong Kong Tycoon 1970–2025</title>
<style>
:root{--bg:#101318;--panel:#171b22;--panel2:#1e232c;--ink:#eef0f3;--dim:#8d95a3;--neon:#E2231A;--cyan:#5EB7E8;--gold:#ffc72c;--green:#3ddc84;--red:#ff5c5c;--line:#2b313c;
 --sea:#08141f;--offmap:#241a1c;--land0:#3a2e24;--border:#ffffff55;--halo:#101318d0;--bgGrad:linear-gradient(#14181f,#0b0d11);--hdr:rgba(16,19,24,.9);--tipBg:#14181ff2;--chart:#14181f}
body.light{--bg:#f6f2ea;--panel:#ffffff;--panel2:#f3eee4;--ink:#1d2230;--dim:#6b7285;--neon:#c8161d;--cyan:#0067a8;--gold:#a86f00;--green:#1d8a4b;--red:#c62f2f;--line:#ddd4c3;
 --sea:#d4e6f1;--offmap:#f6e4ea;--land0:#ece6da;--border:#ffffffcc;--halo:#ffffffd8;--bgGrad:linear-gradient(#faf7f1,#efe9dd);--hdr:rgba(250,247,241,.92);--tipBg:#fffffff2;--chart:#f3eee4}
*{box-sizing:border-box}
body{margin:0;background:var(--bgGrad);color:var(--ink);font:14px/1.45 system-ui,"Segoe UI","Noto Sans TC","Microsoft JhengHei",sans-serif;min-height:100vh}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--panel2);color:var(--ink);border-radius:6px;padding:5px 10px}
button:hover:not(:disabled){border-color:var(--cyan);color:var(--cyan)}
button:disabled{opacity:.4;cursor:not-allowed}
button.primary{background:linear-gradient(90deg,#E2231A,#F38B00);border:0;color:#fff;font-weight:700}
button.primary:hover{filter:brightness(1.1);color:#fff}
button.sm{padding:2px 7px;font-size:12px}
header{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--hdr);position:sticky;top:0;z-index:5}
.logo{font-weight:800;letter-spacing:.5px;font-size:17px}
.logo b{color:var(--neon);text-shadow:0 0 8px #E2231A88}
.logo span{color:var(--cyan);font-weight:600;font-size:13px;margin-left:6px}
.stat{display:flex;flex-direction:column;line-height:1.15}
.stat small{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.6px}
.stat b{font-size:15px;font-variant-numeric:tabular-nums}
.grow{flex:1}
main{display:grid;grid-template-columns:1fr;gap:8px;padding:10px 16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px}
.lenses{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.lenses button.on{border-color:var(--gold);color:var(--gold)}
svg text{pointer-events:none}
.dist{cursor:pointer;transition:filter .15s}
.dist:hover{filter:brightness(1.25)}
path.dist.sel{stroke:var(--gold);stroke-width:2.5}
.lbl{paint-order:stroke;stroke:var(--halo);stroke-width:3px;stroke-linejoin:round}
#tip{position:fixed;pointer-events:none;background:var(--tipBg);border:1px solid var(--cyan);border-radius:8px;padding:8px 10px;font-size:12px;display:none;z-index:20;max-width:260px}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:10px}
.tabs button{border-radius:6px 6px 0 0;font-size:13px}
.tabs button.on{background:var(--neon);border-color:var(--neon);color:#fff}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{padding:4px 5px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{color:var(--dim);font-weight:600;font-size:11px;text-transform:uppercase}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.pos{color:var(--green)}.neg{color:var(--red)}.dim{color:var(--dim)}.gold{color:var(--gold)}.cyan{color:var(--cyan)}
h3{margin:4px 0 8px;font-size:15px}
h3 .zh{color:var(--neon);margin-left:6px}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:5px 0}
.item{border:1px solid var(--line);border-radius:8px;padding:8px;margin:6px 0;background:var(--panel2)}
.item .t{font-weight:600}
.legend{font-size:12px;color:var(--dim);margin-top:6px}
footer{display:flex;gap:10px;align-items:center;padding:0 16px 16px}
#ticker{flex:1;overflow:hidden;white-space:nowrap;color:var(--gold);font-size:13px;border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:var(--panel)}
#ticker span{display:inline-block;animation:tick 40s linear infinite;padding-left:100%}
@keyframes tick{to{transform:translateX(-100%)}}
#modalBg{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:30;padding:16px}
#modal{background:var(--panel);border:1px solid var(--neon);box-shadow:0 0 40px #E2231A44;border-radius:14px;max-width:620px;width:100%;max-height:88vh;overflow:auto;padding:20px}
#modal h2{margin:0 0 4px;font-size:21px}
#modal .zh{color:var(--neon);font-size:15px}
#modal .yr{color:var(--cyan);font-weight:700;letter-spacing:1px;font-size:12px}
#modal p{color:#cfd5e6}
.choices{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.choices button{text-align:left;padding:9px 12px}
.pill{display:inline-block;font-size:11px;padding:1px 6px;border-radius:10px;border:1px solid var(--line);color:var(--dim);margin-left:4px}
input[type=text]{background:var(--panel2);border:1px solid var(--line);color:var(--ink);padding:7px;border-radius:6px;font:inherit;width:100%}
label.chk{font-size:12px;color:var(--dim);display:flex;gap:5px;align-items:center}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;background:var(--cyan)}
</style>
</head>
<body>
<header id="hdr"></header>
<main>
  <div class="tabs" id="tabs" style="margin-bottom:0"></div>
  <section class="card" id="mapView">
    <div class="lenses" id="lenses"></div>
    <svg id="map" viewBox="0 0 640 500" style="width:100%;height:calc(100vh - 235px);min-height:420px;display:block;background:var(--sea);border-radius:10px;cursor:grab"></svg>
    <div class="legend" id="legend"></div>
  </section>
  <section class="card" id="panelView">
    <div id="panel"></div>
  </section>
</main>
<footer>
  <div id="ticker"><span id="tickerText"></span></div>
  <button onclick="A.help()">Sources</button>
  <button onclick="A.toggleTheme()" id="themeBtn">Light mode</button>
  <button onclick="A.games()">Manage saves</button>
  <button onclick="A.newGame()">New game</button>
  <button class="primary" id="endBtn" onclick="A.advance()">End Year ▶</button>
</footer>
<div id="tip"></div>
<div id="modalBg"><div id="modal"></div></div>

function creditLimit(){const y=s.year;
 const assets=.4*Object.keys(s.biz).reduce((a,k)=>a+Math.max(0,bizVal(k)-(s.biz[k].loan||0)),0)+.3*s.props.reduce((a,p)=>a+Math.max(0,propVal(p)-p.loan),0)+(s.origin==='office'&&!Object.keys(s.biz).length?3*salary(y,s.age):0);

  s.props.forEach(p=>{const v=propVal(p);if(p.loan>v*trig){const x=p.loan-v*lv;p.loan-=x;s.cash-=x;tot+=x;if(isCo(p))pco('inv',x);}});
  s.devs.forEach(d=>{const v=devVal(d);if(d.loan>v*dtrig){const x=d.loan-v*.5;d.loan-=x;s.cash-=x;tot+=x;pco('inv',x);}});
  if(tot)notes.push(`<span class="neg">🏦 Property values fell below your loans. The banks called in ${money(tot)} of mortgages and land loans.</span>`);}
 const lim=creditLimit();if((s.credit||0)>lim+1){const x=s.credit-lim;s.credit=lim;s.cash-=x;notes.push(`<span class="neg">🏦 The bank cut your credit line: you had to repay ${money(x)}.</span>`);}
 for(const k in s.biz){const b=s.biz[k],cap=bizVal(k)*.6;if((b.loan||0)>cap){const x=b.loan-cap;b.loan=cap;s.cash-=x;notes.push(`<span class="neg">🏦 Your ${BZ[k].n} lost value: the bank called in ${money(x)} of its loan.</span>`);}}

}

A.buyBiz=k=>{const c=BZ[k].cost*CPI(s.year);if(s.cash<c)return toast('Not enough cash');s.cash-=c;s.biz[k]={cReal:BZ[k].cost,since:s.year,last:0,inv:c,earned:0};log(`Founded ${BZ[k].n} with ${money(c)}`);render();};
// Upgrades raise the profit rate by 15% each (max 3); growing adds capital in steps
const UPG=['New machinery & systems','Professional managers','Brand & marketing'];
const upgMult=b=>1+.15*(b.lvl||0);
const upgCost=b=>b.cReal*CPI(s.year)*.4*((b.lvl||0)+1);
A.upgradeBiz=k=>{const b=s.biz[k];if((b.lvl||0)>=3)return;const c=upgCost(b);if(s.cash<c)return toast('Not enough cash');s.cash-=c;b.inv=(b.inv||0)+c;b.lvl=(b.lvl||0)+1;log(`${BZ[k].n}: ${UPG[b.lvl-1]} (${money(c)}). Profit rate now +${b.lvl*15}%.`);render();};
A.growBiz=(k,f)=>{const b=s.biz[k];const c=b.cReal*CPI(s.year)*f;if(s.cash<c)return toast('Not enough cash');s.cash-=c;b.inv=(b.inv||0)+c;b.cReal*=1+f;log(`Grew your ${BZ[k].n} by ${f*100}% (${money(c)})`);render();};
A.expandBiz=k=>{const b=s.biz[k];const c=b.cReal*CPI(s.year);if(s.cash<c)return toast('Not enough cash');s.cash-=c;b.cReal*=2;log(`Doubled the size of your ${BZ[k].n} (${money(c)})`);render();};
A.sellBiz=k=>{const v=bizVal(k),b=s.biz[k];s.cash+=v-(b.loan||0);delete s.biz[k];const g=v+(b.earned||0)-(b.inv||0);log(`Sold ${BZ[k].n} for ${money(v)}. Lifetime: put in ${money(b.inv||0)}, took out ${money(b.earned||0)} in profits, ${g>=0?'gain':'loss'} ${money(Math.abs(g))}`);render();};
function factoryCap(){return ['garment','toys','elec'].reduce((a,k)=>a+(s.biz[k]?s.biz[k].cReal*CPI(s.year):0),0)}
A.relocate=()=>{const c=factoryCap()*.3;if(s.cash<c)return toast('Not enough cash');s.cash-=c;s.flags.reloc=1;log(`Relocated factories to Shenzhen (${money(c)})`);render();};
const IPO_NAV=20e6,IPO_FACE=15;
function ipoOk(){return !s.ipo&&coNav()>=IPO_NAV*CPI(s.year)&&face()>=IPO_FACE}
A.ipo=()=>{if(!ipoOk())return;const c=.25*mcap();s.cash+=c;s.ipo={own:.75,y:s.year};s.faceBase+=5;log(`${groupName()} lists on the stock exchange. Sold 25% to the public for ${money(c)}.`);render();};
A.placement=()=>{if(!s.ipo||s.ipo.own<.45)return;const c=.1*mcap();s.cash+=c;s.ipo.own-=.1;log(`Placed 10% of ${groupName()} with investors for ${money(c)}.`);render();};
function privCost(){return s.ipo?(1-s.ipo.own)*mcap()*1.3:0}
A.privatise=()=>{const c=privCost();if(!s.ipo||s.cash<c)return;if(s.pledge)return toast('Repay your share-pledge loan before taking the company private');s.cash-=c;s.ipo=null;log(`Took ${groupName()} private, buying out minority shareholders for ${money(c)}.`);render();};
A.buyHSI=f=>{const amt=Math.max(0,s.cash)*f;if(amt<=0)return;s.units+=amt*.995/HSI[s.year];s.cash-=amt;render();};
A.sellHSI=f=>{const u=s.units*f;s.cash+=u*HSI[s.year]*.995;s.units-=u;render();};
A.derby=()=>{if(s.flags.derby)return;s.flags.derby=1;const bet=Math.max(0,s.cash)*.1;const win=Math.random()<.2+(s.luck||0)/2;s.cash+=win?bet*3.5:-bet;const msg=win?`Your horse romped home at 9-2! You won ${money(bet*3.5)}.`:`Your horse finished down the field. Lost ${money(bet)}.`;log('Derby bet: '+msg);toast(msg);render();};
A.markSix=()=>{if(s.flags.m6)return;s.flags.m6=1;const c=2e3*CPI(s.year);s.cash-=c;if(Math.random()<.004){const w=8e6*CPI(s.year);s.cash+=w;log('MARK SIX JACKPOT! '+money(w));toast('🎉 MARK SIX JACKPOT: '+money(w));}else toast('No luck in this year\'s Mark Six draws.');render();};
A.buyItem=k=>{const c=IT[k].cost*CPI(s.year);if(s.cash<c)return toast('Not enough cash');s.cash-=c;s.items.push({id:uid(),k,val:c,cost:c});log(`Bought ${IT[k].n} (${money(c)})`);render();};

A.donate=lvl=>{const amt=[1e5,1e6,1e7][lvl]*CPI(s.year),f=[3,10,25][lvl];if(s.cash<amt)return toast('Not enough cash');s.cash-=amt;s.faceBase+=f;log(`Donated ${money(amt)} — "${s.name} ${['Scholarship','Hospital Wing','University Tower'][lvl]}" (+${f} Reputation)`);render();};

A.gala=()=>{const p=pageantNow();if(!p)return;p.done=1;s.faceBase+=1;log('You attend the Miss Hong Kong gala and are photographed by the gossip magazines. +1 Reputation.');render();};

}

function mapBB(k){if(MAP_BB[k])return MAP_BB[k];let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;

function fitLabel(d,val,k=1){
 const {lx,ly}=MAP_PATHS[d.k],bb=mapBB(d.k),W=Math.min(bb.w*.72,120),H=bb.h*.7;
 const Z=12,E=8.5,V=10,wEn=str=>str.length*.56*E;

  for(let j=1;j<words.length;j++){const a=words.slice(0,j).join(' '),b=words.slice(j).join(' ');const w=Math.max(a.length,b.length);if(!best||w<best[0])best=[w,a,b];}

 $('#tickerText').textContent=`${s.year}  ✦  ${ev.join('  ✦  ')||'Business as usual in the Fragrant Harbour'}  ✦  Fastest-growing district: ${d.en} ${d.zh}  ✦  HSI ${HSI[s.year].toLocaleString()}  ✦  Prime ${PRIME(s.year).toFixed(2)}%  ✦  Population ${(totalPop(s.year)/1e6).toFixed(2)}M  ✦  ${s.auctions.length} government land sales this year${s.pageant&&s.pageant.y===s.year?`  ✦  Miss Hong Kong ${s.year}: ${s.pageant.name}`:''}`;}

/* ================= START / HELP ================= */
A.newGame=()=>{
 showModal(`<div class="yr">1970 · BRITISH HONG KONG</div><h2>Pearl of the Orient <span class="zh">東方之珠</span></h2><p>It is 1970. You are 22, with a little money and big ambitions. The population is 3.9 million, a 500 sq ft flat in Kowloon costs about ${money(500*psf('KC',1970))}, and the Hang Seng stands at 211. You have 56 years to become the largest tycoon.</p>
 <p>Your name: <input type="text" id="nm" value="Wong Kar-fai" maxlength="30"></p><p><label class="chk"><input type="checkbox" id="shuf"> 🔀 <b>Shuffled history</b>: the same events and market swings, but at different times (each moves up to about 4 years). The Joint Declaration and the Handover keep their dates, and MTR lines open on schedule. The real dates are revealed at the end.</label></p><p>Difficulty: <select id="diff"><option value="easy">Easy: property always pays</option><option value="normal" selected>Normal: banks recall loans, buildings cost money to run</option><option value="tycoon">Tycoon: harsher recalls and fire sales</option></select></p><p class="dim">Normal and Tycoon: when prices fall, banks call in mortgages that rise 20 points above the lending limit (Tycoon 10) and repossessed buildings sell at 75% (65%). Rent loses 15% to running costs plus vacancy (5%, more in slumps). Rates spike in 1998. Each extra buy in one district in the same year costs 4% more. Reputation below 0 means dearer loans and no land sales; 40+ means cheaper loans. If you own under half your listed group, rivals may bid for it.</p><p>Your origins:</p><div class="choices">
 <button onclick="A.start('shanghai')">🧵 <b>Shanghainese mill heir</b>: own a garment factory, HK$120K cash</button>
 <button onclick="A.start('chiu')">🚢 <b>Chiu Chow trader's son</b>: HK$200K cash, +25% trading profits</button>
 <button onclick="A.start('office')">💼 <b>Central office clerk</b>: HK$40K savings, a steady salary that rises each year, higher living costs, and a bank loan line of up to 3× salary while you keep the job</button></div>`);
};
A.start=o=>{const n=(($('#nm')||{}).value||'Wong Kar-fai').trim();s=freshState(n,o);s.diff=($('#diff')||{}).value||'easy';s.tl=($('#shuf')||{}).checked?makeTimeline():null;applyTimeline(s.tl);genAuctions();s.hist.push({y:1970,nw:netWorth()});log(`${n} sets out to conquer Hong Kong.`);A.selD=null;A.tab='Map';save();closeModal();render();};
A.help=()=>showModal(`<h2>Sources & notes</h2><p>The idea comes from Karpathy's Civ-style map of US public data. Every series below was downloaded from an official or published source unless marked <b>estimated</b>:</p><ul>
<li><b>District populations — official C&SD counts</b>: 1981 Census District Board Tabulations (domestic-household persons, scaled to the 5,109,812 territory total; Mong Kok + Yau Ma Tei merged into Yau Tsim Mong; Tsuen Wan split into Tsuen Wan / Kwai Tsing by their 1991 ratio, since Kwai Tsing became a district in 1985); 1991, 1996, 2001 (2001 Census Table 1); 2011, 2016, 2021 (2021 Census Main Results Table 3.20). <b>1971 is estimated</b>: districts did not exist yet, so it is back-projected and scaled to the official 1971 total of 3,936,630.</li>
<li><b>Property prices</b>: Rating & Valuation Department private domestic price index (all classes, 1999=100), official 1980–2025; <b>1970–79 estimated</b>. Absolute prices per sq ft and gross rental yields use RVD class B (40–69.9 m²) average prices and rents for Hong Kong Island, Kowloon and the New Territories, 1986–2025. Before 1986 prices follow the index and yields use the 1986 levels (estimated). The premium of each district within its region is a game estimate driven by census population growth and MTR openings.</li><li><b>Hang Seng Index</b>: year-end closes 1970–2025 (Hang Seng Indexes Co. via Wikipedia, checked against Yahoo Finance from 1986).</li><li><b>Interest rates</b>: HKMA best lending rate (HSBC), annual averages 1971–2025; 1970 assumed 8%. Mortgage rate in game = BLR + 0.5% before 2000, BLR − 1.75% after.</li><li><b>Listing your group</b>: share price = net assets × market mood, where mood = Hang Seng close ÷ its 5-year average (real index data), capped at 0.5–1.6, × 0.85. The formula itself is a game rule.</li><li><b>US$ display</b>: values converted at each year's HK$ per US$ rate; 7.80 from 1984 (linked rate since October 1983); <b>1970–83 approximate</b>.</li><li><b>Inflation</b>: C&SD Composite CPI from 1981, chained to CPI(A) 1975–80; <b>1970–74 estimated</b>. Used for business costs, wages and prices of goods.</li>
<li>MTR/KCR opening years; LTV caps (HKMA 70% from 1991, tighter 2009–2024); SSD/DSD stamp duties</li>
<li><b>Shuffled history</b> (optional start): blocks of real years swap places within 1971–83, 1985–96 and 1998–2024, carrying their events, Hang Seng and property changes and interest rates. Prices are rebuilt from the yearly changes, so total growth is the same; Hang Seng levels quoted in event text are the real ones.</li><li>Events are real history. People, tycoons and Miss Hong Kong winners in the game are fictional.</li></ul>
<p class="dim">Not yet from data: business profitability by era, LTV caps and stamp duties (rule summaries), typhoon timing, and district premiums within each region.</p><div class="choices"><button onclick="closeModal()">Close</button></div>`);
/* ===== GAMES MENU: several saved games, copies, file backup ===== */
const ORIGIN={shanghai:'🧵',chiu:'🚢',street:'🥢',office:'💼'};
function useGame(g){s=g;applyTimeline(s.tl);if(s.auctions&&s.auctions.some(a=>!a.rivals))genAuctions();  // saves from before rival bidding
 A.selD=null;A.tab='Map';save();closeModal();render();}
A.games=()=>{save();const L=savedGames();let h=`<h2>Manage saves</h2><p class="dim">Games save automatically after every action, in this browser only. Export a file to back one up or move it to another device.</p><table style="width:100%">`;
 for(const g of L){const cur=g.id===s.id;h+=`<tr><td>${ORIGIN[g.o]||''}${g.sh?' 🔀':''} <b>${g.n}</b> <span class="pill">${DIFF[g.d||'easy']}</span>${cur?' <span class="pos">· playing</span>':''}<br><span class="dim">${g.y}${g.over?' · '+(g.over==='bankrupt'?'bankrupt':'finished'):''} · ${money(g.nw)} · saved ${new Date(g.t).toLocaleString()}</span></td>
 <td style="text-align:right;white-space:nowrap">${cur?'':`<button onclick="A.loadGame('${g.id}')">Load</button> <button onclick="A.delGame('${g.id}')">Delete</button>`}</td></tr>`;}
 h+=`</table><div class="choices"><button onclick="A.newGame()">➕ New game (this one stays saved)</button><button onclick="A.copyGame()">📑 Save a copy of this game, to try another path</button>
 <button onclick="A.exportGame()">💾 Export this game to a file</button><button onclick="$('#impFile').click()">📂 Import a game from a file</button><button onclick="closeModal()">Close</button></div>
 <input type="file" id="impFile" accept=".json,application/json" style="display:none" onchange="A.importGame(this.files[0])">`;showModal(h);};
A.loadGame=id=>{save();const g=load(id);if(!g)return alert('That save could not be read.');useGame(g);};
A.delGame=id=>{const g=savedGames().find(x=>x.id===id);if(!g||!confirm(`Delete ${g.n} (${g.y})? This cannot be undone.`))return;
 localStorage.removeItem(SK+id);localStorage.removeItem(MK+id);A.games();};
A.copyGame=()=>{const c=JSON.parse(JSON.stringify(s));c.id=newId();c.label=(s.label||s.name)+' (copy)';const keep=s;s=c;save();s=keep;save();A.games();};
A.exportGame=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(s)],{type:'application/json'}));
 a.download=`pearl-${s.name.replace(/[^\w-]+/g,'_')}-${s.year}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);};
A.importGame=f=>{if(!f)return;f.text().then(t=>{let g;try{g=JSON.parse(t)}catch(e){}
 if(!g||typeof g.year!=='number'||!Array.isArray(g.props))return alert('That file is not a Pearl of the Orient save.');
 save();g=migrate(g);g.id=newId();g.label=(g.label||g.name)+' (imported)';useGame(g);});};
window.A=A;window.closeModal=closeModal;
initMapZoom();
try{if(localStorage.getItem('hktheme')==='light'){document.body.classList.add('light');$('#themeBtn').textContent='Dark mode';}}catch(e){}
s=load();if(s)applyTimeline(s.tl);if(s&&s.auctions&&s.auctions.some(a=>!a.rivals))genAuctions();  // saves from before rival bidding
if(s)save();  // moves an old single-slot save into the Games list
if(s&&!s.over){render();}else{s=s||freshState('Wong Kar-fai','chiu');render();A.newGame();}
</script>
</body>
